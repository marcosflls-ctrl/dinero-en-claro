name: Índices del mundo

# Cierres de S&P 500, Nasdaq 100, Euro Stoxx 50, DAX, MSCI World, emergentes, oro y Brent (scripts/indices.py).
# Se publica solo si cambian. Varias horas porque GitHub se salta a veces las tareas programadas. Horas en UTC.
on:
  schedule:
    - cron: "41 5,8,21 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/indices.py
      - name: Publicar si hay cambios
        run: |
          git config user.name "indices-bot"
          git config user.email "indices-bot@users.noreply.github.com"
          git add src/data/indices.json
          if ! git diff --cached --quiet; then
            git commit -m "Índices: cierres actualizados"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_AVISOS_CHAT_ID }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Han fallado los índices de Dinero en Claro: ${URL_EJECUCION}"
