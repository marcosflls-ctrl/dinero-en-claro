name: Precio de las criptomonedas

# Descarga el precio de bitcoin, ether y otras criptomonedas en euros (API gratuita de CoinGecko)
# y publica la página. Cuatro veces al día, todos los días (el mercado cripto no cierra). Horas en UTC.
on:
  schedule:
    - cron: "13 6,11,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  cripto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/cripto.py
      - name: Publicar si hay cambios
        run: |
          git config user.name "cripto-bot"
          git config user.email "cripto-bot@users.noreply.github.com"
          git add src/data/cripto.json
          if ! git diff --cached --quiet; then
            git commit -m "Cripto: precios actualizados"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_AVISOS_CHAT_ID }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Ha fallado el precio de las criptomonedas de Dinero en Claro: ${URL_EJECUCION}"
