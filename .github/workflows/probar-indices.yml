name: Probar fuentes de índices

# Comprueba que responden las fuentes de los índices, el oro y el petróleo, sin guardar nada.
on:
  pull_request:
    paths: ["scripts/indices.py"]
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/indices.py --probar
