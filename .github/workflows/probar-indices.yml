name: Probar fuentes de índices

# En una propuesta que cambia scripts/indices.py: descarga los datos y los guarda en esa misma rama,
# para poder revisar las páginas con datos reales antes de aceptarla. A mano: solo prueba las fuentes.
on:
  pull_request:
    paths: ["scripts/indices.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Probar las fuentes
        if: github.event_name != 'pull_request'
        run: python scripts/indices.py --probar
      - name: Descargar y guardar en la rama de la propuesta
        if: github.event_name == 'pull_request'
        run: |
          python scripts/indices.py
          git config user.name "indices-bot"
          git config user.email "indices-bot@users.noreply.github.com"
          git add src/data/indices.json
          git diff --cached --quiet || { git commit -m "Índices: datos de prueba [skip ci]"; git push; }
