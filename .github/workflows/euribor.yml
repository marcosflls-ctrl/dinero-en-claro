name: Euríbor

# Descarga el euríbor diario del Banco de España y publica el dato si ha cambiado.
# (dato oficial, sin redacción). Horas en UTC: 10:30 y 18:30 de España en invierno, de lunes a sábado.
on:
  schedule:
    - cron: "41 8,10,13,16,18 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  euribor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python scripts/euribor.py
      - name: Publicar si hay cambios
        run: |
          git config user.name "euribor-bot"
          git config user.email "euribor-bot@users.noreply.github.com"
          git add src/data/euribor.json
          if ! git diff --cached --quiet; then
            git commit -m "Euríbor: dato actualizado"
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          fi
      - name: Avisar del fallo por Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_AVISOS_CHAT_ID }}
          URL_EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ] && exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Ha fallado el euríbor de Dinero en Claro: ${URL_EJECUCION}"
